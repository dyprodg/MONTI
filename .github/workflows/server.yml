name: Server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Backend/**
      - AgentSim/**
      - Infra/**
      - monitoring/**
      - Caddyfile
      - docker-compose.prod.yml
      - .github/workflows/server.yml
  pull_request:
    branches: [main]
    paths:
      - Backend/**
      - AgentSim/**
      - Infra/**
      - monitoring/**
      - Caddyfile
      - docker-compose.prod.yml
      - .github/workflows/server.yml

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.13.0"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
      agentsim: ${{ steps.filter.outputs.agentsim }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'Infra/**'
            backend:
              - 'Backend/**'
            agentsim:
              - 'AgentSim/**'
            deploy:
              - 'Backend/**'
              - 'AgentSim/**'
              - 'monitoring/**'
              - 'Caddyfile'
              - 'docker-compose.prod.yml'

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    defaults:
      run:
        working-directory: Infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Triggered by @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [changes, terraform-plan]
    if: needs.changes.outputs.infra == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: Infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: Backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...

  test-agentsim:
    name: Test AgentSim
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.agentsim == 'true'
    defaults:
      run:
        working-directory: AgentSim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: AgentSim/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race ./...

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [changes, terraform-apply, test-backend, test-agentsim]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.test-agentsim.result == 'success' || needs.test-agentsim.result == 'skipped') &&
      (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend
        if: needs.changes.outputs.backend == 'true'
        working-directory: Backend
        run: |
          docker build -t ${{ vars.ECR_REGISTRY }}/monti-backend:latest \
                        -t ${{ vars.ECR_REGISTRY }}/monti-backend:${{ github.sha }} .
          docker push ${{ vars.ECR_REGISTRY }}/monti-backend:latest
          docker push ${{ vars.ECR_REGISTRY }}/monti-backend:${{ github.sha }}

      - name: Build and Push AgentSim
        if: needs.changes.outputs.agentsim == 'true'
        working-directory: AgentSim
        run: |
          docker build -t ${{ vars.ECR_REGISTRY }}/monti-agentsim:latest \
                        -t ${{ vars.ECR_REGISTRY }}/monti-agentsim:${{ github.sha }} .
          docker push ${{ vars.ECR_REGISTRY }}/monti-agentsim:latest
          docker push ${{ vars.ECR_REGISTRY }}/monti-agentsim:${{ github.sha }}

      - name: Ensure EC2 is running
        id: ec2-state
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids ${{ vars.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "state=$STATE" >> $GITHUB_OUTPUT
          if [[ "$STATE" != "running" ]]; then
            echo "EC2 is $STATE, starting..."
            aws ec2 start-instances --instance-ids ${{ vars.EC2_INSTANCE_ID }}
            aws ec2 wait instance-running --instance-ids ${{ vars.EC2_INSTANCE_ID }}
            echo "EC2 running, waiting for SSH readiness..."
            sleep 30
          fi

      - name: Prepare EC2 directories
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/ec2-user/monti/monitoring/prometheus
            mkdir -p /home/ec2-user/monti/monitoring/grafana/provisioning/datasources
            mkdir -p /home/ec2-user/monti/monitoring/grafana/provisioning/dashboards
            mkdir -p /home/ec2-user/monti/monitoring/grafana/dashboards

      - name: Copy config files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "monitoring/,Caddyfile,docker-compose.prod.yml"
          target: /home/ec2-user/monti

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            cd /home/ec2-user/monti
            aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.ECR_REGISTRY }}
            cp docker-compose.prod.yml docker-compose.yml
            docker compose pull
            docker compose up -d
            docker image prune -f
            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 10); do
              if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
                echo "Backend healthy after ${i}s"
                break
              fi
              [ "$i" -eq 10 ] && echo "WARNING: Backend health check failed after 10s"
              sleep 1
            done
            echo "=== Container Status ==="
            docker compose ps
            echo "=== Backend Logs (last 30 lines) ==="
            docker compose logs --tail 30 backend

      - name: Install boot service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cat > /tmp/monti-boot.sh << 'BOOT'
            #!/bin/bash
            set -e
            exec >> /var/log/monti-boot.log 2>&1
            echo "$(date): MONTI boot - pulling latest images"
            cd /home/ec2-user/monti
            source .env
            REGION=$(curl -s http://169.254.169.254/latest/meta-data/placement/region)
            aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker compose pull
            docker compose up -d
            docker image prune -f
            echo "$(date): MONTI boot complete"
            BOOT
            sudo mv /tmp/monti-boot.sh /usr/local/bin/monti-boot.sh
            sudo chmod +x /usr/local/bin/monti-boot.sh

            cat > /tmp/monti-boot.service << 'SVC'
            [Unit]
            Description=MONTI Boot - Pull latest images and start containers
            After=docker.service network-online.target
            Wants=network-online.target
            Requires=docker.service

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/monti-boot.sh
            RemainAfterExit=true
            User=root
            Environment=HOME=/home/ec2-user

            [Install]
            WantedBy=multi-user.target
            SVC
            sudo mv /tmp/monti-boot.service /etc/systemd/system/monti-boot.service
            sudo systemctl daemon-reload
            sudo systemctl enable monti-boot.service

      - name: Stop EC2 if outside schedule window
        run: |
          BERLIN_HOUR=$(TZ=Europe/Berlin date +%H)
          BERLIN_DOW=$(TZ=Europe/Berlin date +%u)  # 1=Mon, 7=Sun
          echo "Berlin time: day=$BERLIN_DOW hour=$BERLIN_HOUR"
          if [[ "$BERLIN_DOW" -ge 1 && "$BERLIN_DOW" -le 5 && "$BERLIN_HOUR" -ge 14 && "$BERLIN_HOUR" -lt 16 ]]; then
            echo "Inside schedule window (Mon-Fri 14:00-16:00 Berlin), leaving EC2 running"
          else
            echo "Outside schedule window, stopping EC2..."
            aws ec2 stop-instances --instance-ids ${{ vars.EC2_INSTANCE_ID }}
          fi
